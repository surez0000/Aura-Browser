name: Release

# Cutting a release: `npm version minor` (bumps package.json, commits, tags
# vX.Y.Z), then `git push --follow-tags`. This workflow builds installers on all
# three OSes and publishes them — plus the latest*.yml manifests the in-app
# updater reads — to the GitHub Release for the tag. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - name: Package and publish (macOS, Apple silicon + Intel)
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --arm64 --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish
        if: runner.os != 'macOS'
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization are optional: without a Developer ID the
          # DMG is unsigned (first launch: right-click → Open) and Aurora updates
          # itself by swapping the app bundle instead of through Squirrel.Mac.
          # To sign later, add these secrets to the macOS step above:
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
